# Base44 sandbox only: front door for the preview.
# The MCP server has no UI of its own, so this serves a small status page and
# reverse-proxies the MCP endpoint, giving clients a single origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-store";
    }

    location /mcp {
        proxy_pass http://mcp:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
