# Base44 sandbox environment (dev only) — see the "Base44 sandbox environment"
# section in AGENTS.md. Runs the MCP server from the cloned source, so edits are
# picked up without rebuilding any image.
#
#   web (nginx)  host 3000 -> status page + /mcp reverse proxy   <- preview entry
#   mcp (node)   host 3333 -> Streamable HTTP MCP endpoint
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    # Dependencies live in a named volume (the repo is bind-mounted over /app),
    # so install them from the lockfile once the mounts are in place.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx tsx watch src/index.ts --http --port 3333 --host 0.0.0.0"]
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/mcp',{method:'POST',headers:{'content-type':'application/json',accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list',params:{}})}).then(async r=>{const t=await r.text();process.exit(r.ok&&t.includes('\"tools\"')?0:1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: "video-edit-mcp"
      base44.kind: "api"
      base44.port: "3333"

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./.base44/preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.base44/preview/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || { echo 'landing page FAIL'; exit 1; }; wget -S -O /dev/null http://127.0.0.1/mcp 2>&1 | grep -q '405 Method' || { echo 'mcp proxy FAIL'; exit 1; }"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure
    labels:
      base44.project: "video-edit-mcp-web"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
