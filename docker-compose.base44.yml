# Base44 preview entry (dev only). Mirrors docker-compose.sandbox.yml — run one
# of the two at a time, both publish host port 3000.
# Host port 3000 -> container 3333: GET / is the server's own index page,
# POST /mcp is the Streamable HTTP endpoint.
services:
  mcp:
    build:
      context: .
      dockerfile: .sandbox/Dockerfile
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec ./node_modules/.bin/tsx watch src/index.ts --http --port 3333 --host 0.0.0.0
    ports:
      - "3000:3333"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - deps:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const b=JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'healthcheck',version:'1.0.0'}}});fetch('http://127.0.0.1:3333/mcp',{method:'POST',headers:{'content-type':'application/json',accept:'application/json, text/event-stream'},body:b}).then(r=>{if(!r.ok){console.error('mcp probe failed: HTTP '+r.status);process.exit(1)}const reader=r.body.getReader();const dec=new TextDecoder();const pump=()=>reader.read().then(({done,value})=>{if(value&&dec.decode(value).includes('serverInfo')){console.log('mcp probe ok');process.exit(0)}if(done){console.error('mcp probe failed: stream ended without a response');process.exit(1)}return pump()});return pump()}).catch(e=>{console.error('mcp probe failed: '+e.message);process.exit(1)})"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "video-edit-mcp"
      base44.kind: "api"
      base44.port: "3000"

volumes:
  deps:
