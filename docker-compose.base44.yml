# Base44 sandbox/dev environment for video-edit-mcp.
# Dev-oriented: the repo is bind-mounted, dependencies install at startup from the
# lockfile and the MCP server runs through `tsx watch`, so edits apply without a rebuild.
services:
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.base44
    working_dir: /app
    labels:
      base44.project: video-edit-mcp
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    environment:
      # Supplied by the platform; the server needs no sandbox-specific behaviour, so
      # it is only forwarded (see AGENTS.md "Dev environment").
      - BASE44_PREVIEW_MODE
    env_file:
      # Platform-managed secrets, delivered outside the repo (last wins).
      - /run/base44/app.env
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci && exec npx tsx watch src/index.ts --http --port 3000 --host 0.0.0.0"]
    healthcheck:
      # GET / is the server's index page; a 200 proves the MCP server is serving.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: on-failure

volumes:
  node_modules:
