version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    open-pull-requests-limit: 5
    # @hyperframes/producer: actualizar a mano (Reelo fija otra versión; alinear antes de subir).
    ignore:
      - dependency-name: "@hyperframes/producer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dev-deps: { dependency-type: development, update-types: [minor, patch] }
      prod-deps: { dependency-type: production, update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    groups:
      actions: { patterns: ["*"] }
